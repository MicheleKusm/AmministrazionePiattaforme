# profile
spring.profiles.active=dev
spring.application.name=AC_RGS_PlatformMS
server.port=9089
server.servlet.context-path=/platform

# actuator
management.server.port=9089
management.endpoints.web.base-path=/health
management.endpoints.web.path-mapping.health=ready
management.endpoints.web.exposure.include=health,info,live,metrics,mappings
management.health.db.enabled=false

# openapi
springdoc.swagger-ui.path=/openapi-ui

# datasource (override via env in real environments)
spring.datasource.url=${PLATFORM_DB_URL:jdbc:oracle:thin:@localhost:1521/ORCLCDB}
spring.datasource.username=${PLATFORM_DB_USER:ACRGS_WEB1}
spring.datasource.password=${PLATFORM_DB_PASSWORD:ACRGS_WEB}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
